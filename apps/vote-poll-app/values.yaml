# ==============================================================================
# Values for the vote-poll-app umbrella chart.
# ==============================================================================
# This file defines the configuration for all microservices in the application.
# It is the single source of truth for deploying the entire stack via Helm.

# ------------------------------------------------------------------------------
# Global Settings
# ------------------------------------------------------------------------------

# Global configuration values that will be placed in the 'vote-poll-config' ConfigMap.
config:
  AUTH_SERVICE_URL: "http://auth-service:8080"
  USER_SERVICE_URL: "http://user-service:8080"
  POLL_SERVICE_URL: "http://poll-service:8080"
  VOTE_SERVICE_URL: "http://vote-service:8080"
  RESULT_SERVICE_URL: "http://result-service:8080"
  API_GATEWAY_URL: "http://api-gateway:8080"
  DB_HOST: "postgres-db"
  DB_PORT: "5432"
  DB_NAME: "postgres"
  DB_SCHEMA_AUTH: "auth"
  DB_SCHEMA_USERS: "users"
  DB_SCHEMA_POLLS: "polls"
  DB_SCHEMA_VOTES: "votes"
  DB_SCHEMA_RESULTS: "results"

# Global secret values that will be placed in the 'vote-poll-secrets' Secret.
# YAML anchors (&) are used to define credentials once and reuse them below (*).
secrets:
  DB_USER: &db_user "postgres"
  DB_PASSWORD: &db_password "postgres_password"
  JDBC_URL: "jdbc:postgresql://postgres-db:5432/postgres"
  AUTH_JDBC_URL: "jdbc:postgresql://postgres-db:5432/postgres?currentSchema=auth"
  POLL_JDBC_URL: "jdbc:postgresql://postgres-db:5432/postgres?currentSchema=polls"
  USER_DATABASE_URL: "postgresql://postgres:postgres_password@postgres-db:5432/postgres?options=--search_path%3Dusers"
  VOTE_DATABASE_URL: "postgresql://postgres:postgres_password@postgres-db:5432/postgres?options=--search_path%3Dvotes,polls"
  RESULT_DATABASE_URL: "postgresql://postgres:postgres_password@postgres-db:5432/postgres?options=--search_path%3Dresults,polls,votes"
  JWT_SECRET: "dev-secret-key-change-in-production-12345"
  DATABASE_POOL_SIZE: "10"
  DATABASE_MAX_IDLE_TIME: "30"

# Global toggle for NetworkPolicy creation.
networkPolicy:
  enabled: false

# ------------------------------------------------------------------------------
# Sub-chart Configurations
# ------------------------------------------------------------------------------

# Configuration for the PostgreSQL database sub-chart.
postgres-db:
  fullnameOverride: "postgres-db"
  postgresql:
    username: *db_user
    password: *db_password
    database: "postgres"
  initdb:
    enabled: true
    script: |
      CREATE EXTENSION IF NOT EXISTS pgcrypto;
      CREATE SCHEMA IF NOT EXISTS auth;
      CREATE SCHEMA IF NOT EXISTS users;
      CREATE SCHEMA IF NOT EXISTS polls;
      CREATE SCHEMA IF NOT EXISTS votes;
      CREATE SCHEMA IF NOT EXISTS results;
      CREATE TABLE IF NOT EXISTS auth.admins (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), email VARCHAR(255) UNIQUE NOT NULL, password_hash VARCHAR(255) NOT NULL, role VARCHAR(50) NOT NULL DEFAULT 'ADMIN', active BOOLEAN NOT NULL DEFAULT TRUE, created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(), updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW());
      CREATE TABLE IF NOT EXISTS auth.refresh_tokens (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), admin_id UUID NOT NULL REFERENCES auth.admins(id) ON DELETE CASCADE, token_hash VARCHAR(255) NOT NULL, expires_at TIMESTAMPTZ NOT NULL, created_at TIMESTAMPTZ NOT NULL DEFAULT NOW());
      CREATE TABLE IF NOT EXISTS users.profiles (id UUID PRIMARY KEY, email VARCHAR(255) UNIQUE NOT NULL, display_name VARCHAR(255) NOT NULL, created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(), updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW());
      CREATE TABLE IF NOT EXISTS polls.polls (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), slug VARCHAR(100) UNIQUE NOT NULL, title VARCHAR(500) NOT NULL, description TEXT, created_by UUID NOT NULL, status VARCHAR(20) NOT NULL DEFAULT 'DRAFT', start_at TIMESTAMPTZ NOT NULL, end_at TIMESTAMPTZ NOT NULL, created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(), updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(), CONSTRAINT valid_window CHECK (end_at > start_at));
      CREATE TABLE IF NOT EXISTS polls.options (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), poll_id UUID NOT NULL REFERENCES polls.polls(id) ON DELETE CASCADE, label VARCHAR(500) NOT NULL, sort_order INT NOT NULL DEFAULT 0);
      CREATE INDEX IF NOT EXISTS idx_polls_slug ON polls.polls(slug);
      CREATE INDEX IF NOT EXISTS idx_polls_status ON polls.polls(status);
      CREATE TABLE IF NOT EXISTS votes.votes (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), poll_id UUID NOT NULL, option_id UUID NOT NULL, voter_fingerprint VARCHAR(64) NOT NULL, voted_at TIMESTAMPTZ NOT NULL DEFAULT NOW(), UNIQUE (poll_id, voter_fingerprint));
      CREATE INDEX IF NOT EXISTS idx_votes_poll ON votes.votes(poll_id);
      CREATE TABLE IF NOT EXISTS results.snapshots (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), poll_id UUID UNIQUE NOT NULL, total_votes INT NOT NULL DEFAULT 0, published BOOLEAN NOT NULL DEFAULT FALSE, published_at TIMESTAMPTZ, computed_at TIMESTAMPTZ NOT NULL DEFAULT NOW());
      CREATE TABLE IF NOT EXISTS results.option_totals (snapshot_id UUID NOT NULL REFERENCES results.snapshots(id) ON DELETE CASCADE, option_id UUID NOT NULL, option_label VARCHAR(500) NOT NULL, vote_count INT NOT NULL DEFAULT 0, percentage NUMERIC(5,2) NOT NULL DEFAULT 0, PRIMARY KEY (snapshot_id, option_id));
      INSERT INTO auth.admins (email, password_hash, role) VALUES ('admin@votepoll.local', '$2a$10$3wt8vmIwOXE/6GokZsvATeIPEKlgpRdykA7rPKrmMVRCg2AUfK0K.', 'ADMIN') ON CONFLICT (email) DO NOTHING;
      INSERT INTO users.profiles (id, email, display_name) SELECT id, email, 'System Admin' FROM auth.admins WHERE email = 'admin@votepoll.local' ON CONFLICT (email) DO NOTHING;

# --- Application Microservices ---

frontend:
  enabled: true
  nameOverride: "frontend"
  fullnameOverride: "frontend"
  replicaCount: 3
  image:
    repository: "frontend"
    tag: "latest"
    pullPolicy: Never
  service:
    type: NodePort
    port: 8080
  # Mount the main configmap, but no specific secrets.
  existingConfigMap: "vote-poll-config"
  existingSecret: ""
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  # No probes defined for frontend in the source YAML.
  livenessProbe:
    enabled: false
  readinessProbe:
    enabled: false
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 50


api-gateway:
  enabled: true
  nameOverride: "api-gateway"
  fullnameOverride: "api-gateway"
  replicaCount: 1
  image:
    repository: "api-gateway"
    tag: "latest" # Replace with actual tag in CI/CD
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8080
  # Mount the main configmap, but no specific secrets.
  existingConfigMap: "vote-poll-config"
  existingSecret: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  livenessProbe:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

auth-service:
  enabled: true
  nameOverride: "auth-service"
  fullnameOverride: "auth-service"
  replicaCount: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  image:
    repository: "auth-service"
    tag: "latest" # Replace with actual tag in CI/CD
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8080
  existingConfigMap: "vote-poll-config"
  existingSecret: "vote-poll-secrets"
  env:
    - name: DATABASE_URL
      valueFrom: { secretKeyRef: { name: vote-poll-secrets, key: AUTH_JDBC_URL } }
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 384Mi
  livenessProbe:
    path: /actuator/health
    initialDelaySeconds: 40
    periodSeconds: 20
  readinessProbe:
    path: /actuator/health
    initialDelaySeconds: 30
    periodSeconds: 10
  serviceMonitor:
    enabled: true
    path: /actuator/prometheus


user-service:
  enabled: true
  nameOverride: "user-service"
  fullnameOverride: "user-service"
  replicaCount: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  image:
    repository: "user-service"
    tag: "latest" # Replace with actual tag in CI/CD
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8080
  # Does not mount the main configmap, only specific secrets.
  existingConfigMap: ""
  existingSecret: "vote-poll-secrets"
  env:
    - name: DATABASE_URL
      valueFrom: { secretKeyRef: { name: vote-poll-secrets, key: USER_DATABASE_URL } }
    - name: DB_USER
      valueFrom: { secretKeyRef: { name: vote-poll-secrets, key: DB_USER } }
    - name: JWT_SECRET
      valueFrom: { secretKeyRef: { name: vote-poll-secrets, key: JWT_SECRET } }
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  livenessProbe:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

poll-service:
  enabled: true
  nameOverride: "poll-service"
  fullnameOverride: "poll-service"
  replicaCount: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
