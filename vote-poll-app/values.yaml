# Values for the vote-poll-app umbrella chart.
# Each key under this top level corresponds to a microservice (a sub-chart alias).

# Global configuration values that will be placed in the vote-poll-config ConfigMap.
# This makes the chart self-contained and aligned with the k8s-minikube setup.
config:
  AUTH_SERVICE_URL: "http://auth-service:8080"
  USER_SERVICE_URL: "http://user-service:8080"
  POLL_SERVICE_URL: "http://poll-service:8080"
  VOTE_SERVICE_URL: "http://vote-service:8080"
  RESULT_SERVICE_URL: "http://result-service:8080"
  API_GATEWAY_URL: "http://api-gateway:8080"

  # Minikube PostgreSQL Database Configuration
  DB_HOST: "postgres-db"
  DB_PORT: "5432"
  DB_NAME: "postgres"

  # Schemas used by each service against the shared Postgres database
  DB_SCHEMA_AUTH: "auth"
  DB_SCHEMA_USERS: "users"
  DB_SCHEMA_POLLS: "polls"
  DB_SCHEMA_VOTES: "votes"
  DB_SCHEMA_RESULTS: "results"

frontend:
  enabled: true
  nameOverride: "frontend"
  image:
    repository: "frontend"
    tag: "latest" # It's recommended to override this with a specific tag during deployment
  service:
    port: 8080 # The container port for the frontend service

api-gateway:
  enabled: true
  nameOverride: "api-gateway"
  image:
    repository: "api-gateway"
    tag: "latest"
  service:
    port: 8080

auth-service:
  enabled: true
  nameOverride: "auth-service"
  image:
    repository: "auth-service"
    tag: "latest"
  service:
    port: 8080

user-service:
  enabled: true
  nameOverride: "user-service"
  image:
    repository: "user-service"
    tag: "latest"
  service:
    port: 8080

poll-service:
  enabled: true
  nameOverride: "poll-service"
  image:
    repository: "poll-service"
    tag: "latest"
  service:
    port: 8080

vote-service:
  enabled: true
  nameOverride: "vote-service"
  image:
    repository: "vote-service"
    tag: "latest"
  service:
    port: 8080

result-service:
  enabled: true
  nameOverride: "result-service"
  image:
    repository: "result-service"
    tag: "latest"
  service:
    port: 8080

secrets:
  DB_USER: &db_user "postgres"
  DB_PASSWORD: &db_password "postgres_password"
  JDBC_URL: "jdbc:postgresql://postgres-db:5432/postgres"
  AUTH_JDBC_URL: "jdbc:postgresql://postgres-db:5432/postgres?currentSchema=auth"
  POLL_JDBC_URL: "jdbc:postgresql://postgres-db:5432/postgres?currentSchema=polls"
  USER_DATABASE_URL: "postgresql://postgres:postgres_password@postgres-db:5432/postgres?options=--search_path%3Dusers"
  VOTE_DATABASE_URL: "postgresql://postgres:postgres_password@postgres-db:5432/postgres?options=--search_path%3Dvotes,polls"
  RESULT_DATABASE_URL: "postgresql://postgres:postgres_password@postgres-db:5432/postgres?options=--search_path%3Dresults,polls,votes"
  JWT_SECRET: "dev-secret-key-change-in-production-12345"
  DATABASE_POOL_SIZE: "10"
  DATABASE_MAX_IDLE_TIME: "30"

networkPolicy:
  enabled: false

postgres-db:
  postgresql:
    username: *db_user
    password: *db_password
    database: "postgres"
  initdb:
    enabled: true
    script: |
      -- Vote Polling Platform — PostgreSQL initialization for Minikube
      -- Mirror of production Cloud SQL schema (ms/database/init.sql)

      -- Enable UUID helpers used by the service tables
      CREATE EXTENSION IF NOT EXISTS pgcrypto;

      -- Create schemas
      CREATE SCHEMA IF NOT EXISTS auth;
      CREATE SCHEMA IF NOT EXISTS users;
      CREATE SCHEMA IF NOT EXISTS polls;
      CREATE SCHEMA IF NOT EXISTS votes;
      CREATE SCHEMA IF NOT EXISTS results;
      
      -- Auth schema
      CREATE TABLE IF NOT EXISTS auth.admins (
          id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          email VARCHAR(255) UNIQUE NOT NULL,
          password_hash VARCHAR(255) NOT NULL,
          role VARCHAR(50) NOT NULL DEFAULT 'ADMIN',
          active BOOLEAN NOT NULL DEFAULT TRUE,
          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );
      
      CREATE TABLE IF NOT EXISTS auth.refresh_tokens (
          id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          admin_id UUID NOT NULL REFERENCES auth.admins(id) ON DELETE CASCADE,
          token_hash VARCHAR(255) NOT NULL,
          expires_at TIMESTAMPTZ NOT NULL,
          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );
      
      -- Users schema (admin profiles)
      CREATE TABLE IF NOT EXISTS users.profiles (
          id UUID PRIMARY KEY,
          email VARCHAR(255) UNIQUE NOT NULL,
          display_name VARCHAR(255) NOT NULL,
          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );
      
      -- Polls schema
      CREATE TABLE IF NOT EXISTS polls.polls (
          id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          slug VARCHAR(100) UNIQUE NOT NULL,
          title VARCHAR(500) NOT NULL,
          description TEXT,
          created_by UUID NOT NULL,
          status VARCHAR(20) NOT NULL DEFAULT 'DRAFT',
          start_at TIMESTAMPTZ NOT NULL,
          end_at TIMESTAMPTZ NOT NULL,
          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          CONSTRAINT valid_window CHECK (end_at > start_at)
      );
      
      CREATE TABLE IF NOT EXISTS polls.options (
          id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          poll_id UUID NOT NULL REFERENCES polls.polls(id) ON DELETE CASCADE,
          label VARCHAR(500) NOT NULL,
          sort_order INT NOT NULL DEFAULT 0
      );
      
      CREATE INDEX IF NOT EXISTS idx_polls_slug ON polls.polls(slug);
      CREATE INDEX IF NOT EXISTS idx_polls_status ON polls.polls(status);
      
      -- Votes schema
      CREATE TABLE IF NOT EXISTS votes.votes (
          id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          poll_id UUID NOT NULL,
          option_id UUID NOT NULL,
          voter_fingerprint VARCHAR(64) NOT NULL,
          voted_at TIMESTAMTz NOT NULL DEFAULT NOW(),
          UNIQUE (poll_id, voter_fingerprint)
      );
      
      CREATE INDEX IF NOT EXISTS idx_votes_poll ON votes.votes(poll_id);
      
      -- Results schema
      CREATE TABLE IF NOT EXISTS results.snapshots (
          id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          poll_id UUID UNIQUE NOT NULL,
          total_votes INT NOT NULL DEFAULT 0,
          published BOOLEAN NOT NULL DEFAULT FALSE,
          published_at TIMESTAMPTZ,
          computed_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );
      
      CREATE TABLE IF NOT EXISTS results.option_totals (
          snapshot_id UUID NOT NULL REFERENCES results.snapshots(id) ON DELETE CASCADE,
          option_id UUID NOT NULL,
          option_label VARCHAR(500) NOT NULL,
          vote_count INT NOT NULL DEFAULT 0,
          percentage NUMERIC(5,2) NOT NULL DEFAULT 0,
          PRIMARY KEY (snapshot_id, option_id)
      );
      
      -- Seed default admin (password: password — change in production)
      INSERT INTO auth.admins (email, password_hash, role)
      VALUES ('admin@votepoll.local', '$2a$10$3wt8vmIwOXE/6GokZsvATeIPEKlgpRdykA7rPKrmMVRCg2AUfK0K.', 'ADMIN')
      ON CONFLICT (email) DO NOTHING;
      
      INSERT INTO users.profiles (id, email, display_name)
      SELECT id, email, 'System Admin' FROM auth.admins WHERE email = 'admin@votepoll.local'
      ON CONFLICT (email) DO NOTHING;
