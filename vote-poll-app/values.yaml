# Values for the vote-poll-app umbrella chart.
# Each key under this top level corresponds to a microservice (a sub-chart alias).

# Global configuration values that will be placed in the vote-poll-config ConfigMap.
# This makes the chart self-contained and aligned with the k8s-minikube setup.
config:
  AUTH_SERVICE_URL: "http://auth-service:8080"
  USER_SERVICE_URL: "http://user-service:8080"
  POLL_SERVICE_URL: "http://poll-service:8080"
  VOTE_SERVICE_URL: "http://vote-service:8080"
  RESULT_SERVICE_URL: "http://result-service:8080"
  API_GATEWAY_URL: "http://api-gateway:8080"

  # Minikube PostgreSQL Database Configuration
  DB_HOST: "postgres-db"
  DB_PORT: "5432"
  DB_NAME: "postgres"

  # Schemas used by each service against the shared Postgres database
  DB_SCHEMA_AUTH: "auth"
  DB_SCHEMA_USERS: "users"
  DB_SCHEMA_POLLS: "polls"
  DB_SCHEMA_VOTES: "votes"
  DB_SCHEMA_RESULTS: "results"

frontend:
  enabled: true
  nameOverride: "frontend"
  image:
    repository: "frontend"
    tag: "latest" # It's recommended to override this with a specific tag during deployment
  service:
    port: 8080 # The container port for the frontend service

api-gateway:
  enabled: true
  nameOverride: "api-gateway"
  image:
    repository: "api-gateway"
    tag: "latest"
  service:
    port: 8080

auth-service:
  enabled: true
  nameOverride: "auth-service"
  image:
    repository: "auth-service"
    tag: "latest"
  service:
    port: 8080

user-service:
  enabled: true
  nameOverride: "user-service"
  image:
    repository: "user-service"
    tag: "latest"
  service:
    port: 8080

poll-service:
  enabled: true
  nameOverride: "poll-service"
  image:
    repository: "poll-service"
    tag: "latest"
  service:
    port: 8080

vote-service:
  enabled: true
  nameOverride: "vote-service"
  image:
    repository: "vote-service"
    tag: "latest"
  service:
    port: 8080

result-service:
  enabled: true
  nameOverride: "result-service"
  image:
    repository: "result-service"
    tag: "latest"
  service:
    port: 8080

secrets:
  DB_USER: "postgres"
  DB_PASSWORD: "postgres_password"
  JDBC_URL: "jdbc:postgresql://postgres-db:5432/postgres"
  AUTH_JDBC_URL: "jdbc:postgresql://postgres-db:5432/postgres?currentSchema=auth"
  POLL_JDBC_URL: "jdbc:postgresql://postgres-db:5432/postgres?currentSchema=polls"
  USER_DATABASE_URL: "postgresql://postgres:postgres_password@postgres-db:5432/postgres?options=--search_path%3Dusers"
  VOTE_DATABASE_URL: "postgresql://postgres:postgres_password@postgres-db:5432/postgres?options=--search_path%3Dvotes,polls"
  RESULT_DATABASE_URL: "postgresql://postgres:postgres_password@postgres-db:5432/postgres?options=--search_path%3Dresults,polls,votes"
  JWT_SECRET: "dev-secret-key-change-in-production-12345"
  DATABASE_POOL_SIZE: "10"
  DATABASE_MAX_IDLE_TIME: "30"
