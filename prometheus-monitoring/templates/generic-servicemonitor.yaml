apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "prometheus-monitoring.fullname" . }}-generic-services
  labels:
    {{- include "prometheus-monitoring.labels" . | nindent 4 }}
spec:
  # Discover and scrape services in all namespaces
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      prometheus.io/scrape: "true"
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
    - port: metrics
      path: /metrics
      interval: 15s
    - port: web
      path: /metrics
      interval: 15s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "prometheus-monitoring.fullname" . }}-spring-boot-services
  labels:
    {{- include "prometheus-monitoring.labels" . | nindent 4 }}
spec:
  # Discover and scrape Spring Boot services in all namespaces
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      prometheus.io/scrape-spring: "true"
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
    - port: metrics
      path: /actuator/prometheus
      interval: 15s
