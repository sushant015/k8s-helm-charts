# Default values for postgres-db chart.
replicaCount: 1

image:
  repository: "postgres"
  pullPolicy: IfNotPresent
  tag: "15-alpine"

# Database credentials
postgresql:
  username: "postgres"
  password: "postgres_password"
  database: "postgres"

service:
  type: ClusterIP
  port: 5432

persistence:
  enabled: true
  size: "5Gi"
  storageClass: "standard"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  enabled: true
  command:
    - "/bin/sh"
    - "-c"
    - "pg_isready -U postgres"
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  enabled: true
  command:
    - "/bin/sh"
    - "-c"
    - "pg_isready -U postgres"
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 6

# Database initialization script
# Enabled by default, but can be turned off if not needed.
initdb:
  enabled: false
  script: ""

